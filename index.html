<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<h2 id="title">Загрузка...</h2>
<div id="content"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();

/* --- определяем режим --- */
let mode = new URLSearchParams(location.search).get("mode");

// fallback
if(!mode){
  mode = "diagnostic";
}

/* --- простой экран --- */
function show(text){
  document.getElementById("title").innerText = text;
}

/* --- диагностика --- */
let score = 0;
let step = 0;

const questions = [
"Часто ли тревожные мысли?",
"Есть ли напряжение?",
"Сложно расслабиться?"
];

function startTest(){
  next();
}

function next(){
  if(step >= questions.length){
    showResult();
    return;
  }

  document.getElementById("title").innerText =
    `Вопрос ${step+1} из ${questions.length}`;

  document.getElementById("content").innerHTML = `
    <p>${questions[step]}</p>
    <button onclick="answer(2)">Часто</button>
    <button onclick="answer(1)">Иногда</button>
    <button onclick="answer(0)">Редко</button>
  `;
}

function answer(v){
  score += v;
  step++;
  next();
}

function showResult(){
  show("Результат");

  document.getElementById("content").innerHTML = `
    <p>Баллы: ${score}</p>
    <button onclick="send()">Отправить</button>
  `;
}

function send(){
  if(tg){
    tg.sendData(JSON.stringify({
      type:"diagnostic",
      score:score
    }));
  } else {
    alert("НЕ WebApp");
  }
}

/* --- запуск --- */
if(mode === "diagnostic"){
  startTest();
} else {
  show("Режим: " + mode);
}
</script>

</body>
</html>
