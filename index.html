<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    padding: 20px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    background: #3b82f6;
    color: white;
}
</style>
</head>

<body>

<h2 id="q"></h2>
<div id="answers"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const questions = [
    "Чувствуешь тревогу?",
    "Есть напряжение?",
    "Трудно расслабиться?",
    "Много мыслей?",
    "Есть беспокойство?"
];

let step = 0;
let score = 0;

function render() {
    document.getElementById("q").innerText =
        `${step + 1}/${questions.length} — ${questions[step]}`;

    document.getElementById("answers").innerHTML = `
        <button onclick="answer(2)">Да</button>
        <button onclick="answer(1)">Иногда</button>
        <button onclick="answer(0)">Нет</button>
    `;
}

function answer(val) {
    score += val;
    step++;

    if (step >= questions.length) {
        finish();
    } else {
        render();
    }
}

function finish() {
    document.getElementById("q").innerText =
        `Готово. Баллы: ${score}`;

    document.getElementById("answers").innerHTML = `
        <button onclick="send()">Отправить</button>
    `;
}

function send() {
    tg.sendData(JSON.stringify({
        type: "diagnostic",
        score: score
    }));

    setTimeout(() => tg.close(), 300);
}

render();
</script>

</body>
</html>
