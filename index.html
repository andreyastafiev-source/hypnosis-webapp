<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Диагностика</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:16px;
}

.screen {
  display:none;
}

.active {
  display:block;
}

.card {
  background:white;
  padding:16px;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
  border:1px solid #eee;
}

.card:hover {
  background:#eef2ff;
}

.btn {
  display:block;
  margin-top:20px;
  text-align:center;
  background:#1e3a8a;
  color:white;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
}

.result-box {
  background:white;
  padding:16px;
  border-radius:12px;
  margin-top:12px;
}
</style>
</head>

<body>

<div id="app">

<!-- SCREEN 1 -->
<div id="step1" class="screen active">
  <h2 id="title">Что вас беспокоит?</h2>

  <div class="card" onclick="step1('anxiety')">Тревога</div>
  <div class="card" onclick="step1('fear')">Страх</div>
  <div class="card" onclick="step1('burnout')">Выгорание</div>
  <div class="card" onclick="step1('relations')">Отношения</div>
</div>

<!-- SCREEN 2 -->
<div id="step2" class="screen">
  <h2>Уточните состояние</h2>
  <div id="options"></div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <h2>Ваш результат</h2>
  <div class="result-box" id="resultText"></div>

  <a class="btn" href="https://t.me/AndreyAstafiev?text=Хочу%20записаться">
    Записаться на консультацию
  </a>
</div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;
if (user) {
  document.getElementById("title").innerText =
    user.first_name + ", что вас беспокоит?";
}

let mainChoice = "";

function show(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
}

function step1(type) {
  mainChoice = type;
  const options = document.getElementById("options");
  options.innerHTML = "";

  let variants = [];

  if (type === 'anxiety') {
    variants = [
      "Постоянные мысли и накручивание",
      "Тревога без причины",
      "Физическое напряжение"
    ];
  }

  if (type === 'fear') {
    variants = [
      "Страх общения",
      "Страх выступлений",
      "Конкретные фобии"
    ];
  }

  if (type === 'burnout') {
    variants = [
      "Нет энергии",
      "Нет мотивации",
      "Раздражение и усталость"
    ];
  }

  if (type === 'relations') {
    variants = [
      "Конфликты",
      "Страх близости",
      "Зависимость от партнера"
    ];
  }

  variants.forEach(v => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = v;
    div.onclick = () => showResult(type, v);
    options.appendChild(div);
  });

  show("step2");
}

function showResult(type, detail) {
  let text = "";

  if (type === 'anxiety') {
    text = "У вас повышенный уровень тревожности.\n\n" +
    "Скорее всего, есть внутренний контроль и напряжение.\n\n" +
    "Рекомендуется работа с подсознанием через гипноз — это самый быстрый способ снизить тревогу.";
  }

  if (type === 'fear') {
    text = "Страх закрепился на уровне реакции.\n\n" +
    "Это не логическая проблема, а автоматическая.\n\n" +
    "Гипнотерапия помогает убрать корень страха.";
  }

  if (type === 'burnout') {
    text = "Вы находитесь в состоянии выгорания.\n\n" +
    "Ресурс истощён, психика защищается.\n\n" +
    "Важно восстановление через глубокую работу.";
  }

  if (type === 'relations') {
    text = "У вас повторяющиеся сценарии в отношениях.\n\n" +
    "Это глубинные установки.\n\n" +
    "Они эффективно прорабатываются в терапии.";
  }

  document.getElementById("resultText").innerText =
    text + "\n\nВы выбрали: " + detail;

  show("result");
}
</script>

</body>
</html>
