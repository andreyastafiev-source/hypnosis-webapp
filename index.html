<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ состояния</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    font-family: Arial;
    padding: 20px;
    background: #0f172a;
    color: white;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
}

.progress {
    margin-bottom: 10px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="card">
    <div id="progress" class="progress"></div>
    <div id="question"></div>
    <div id="answers"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const questions = [
    {q: "Чувствуете тревогу?", a: 2},
    {q: "Есть напряжение в теле?", a: 2},
    {q: "Трудно расслабиться?", a: 2},
    {q: "Много мыслей в голове?", a: 2},
    {q: "Есть страх или беспокойство?", a: 2}
];

let step = 0;
let score = 0;

function render() {
    document.getElementById("progress").innerText =
        `Вопрос ${step + 1} из ${questions.length}`;

    document.getElementById("question").innerText =
        questions[step].q;

    document.getElementById("answers").innerHTML = `
        <button onclick="answer(2)">Да</button>
        <button onclick="answer(1)">Иногда</button>
        <button onclick="answer(0)">Нет</button>
    `;
}

function answer(val) {
    score += val;
    step++;

    if (step >= questions.length) {
        finish();
    } else {
        render();
    }
}

function finish() {
    let result = "";

    if (score >= 8) {
        result = "Высокий уровень тревоги";
    } else if (score >= 4) {
        result = "Средний уровень";
    } else {
        result = "Низкий уровень";
    }

    document.getElementById("question").innerHTML =
        `<h3>${result}</h3><p>Баллы: ${score}</p>`;

    document.getElementById("answers").innerHTML = `
        <button onclick="sendResult()">Отправить результат</button>
    `;
}

function sendResult() {
    tg.sendData(JSON.stringify({
        type: "diagnostic",
        score: score
    }));

    tg.close();
}

render();
</script>

</body>
</html>
