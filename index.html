<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Диагностика</title>

<style>
body{font-family:-apple-system;background:#f5f7fb;margin:0;padding:16px;}
.container{max-width:520px;margin:0 auto;}
.screen{display:none;}
.active{display:block;}
.card{background:#fff;padding:14px;border-radius:12px;margin-top:10px;border:1px solid #eee;cursor:pointer;}
.card:hover{background:#eef2ff;}
.btn{display:block;margin-top:14px;text-align:center;background:#1e3a8a;color:#fff;padding:14px;border-radius:12px;text-decoration:none;}
.box{background:#fff;padding:16px;border-radius:12px;margin-top:12px;line-height:1.6;}
textarea{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:1px solid #ccc;}
</style>
</head>

<body>
<div class="container">

<div id="question" class="screen">
<h2 id="qTitle"></h2>
<div id="answers"></div>
</div>

<div id="result" class="screen">
<h2>Разбор состояния</h2>
<div id="resultText" class="box"></div>

<a class="btn" href="?mode=audio">🎧 Попробовать практику</a>

<a id="consultBtn" class="btn" target="_blank">Записаться на консультацию</a>
<a id="hypnoBtn" class="btn" target="_blank">Записаться на гипноз</a>
</div>

<div id="audio" class="screen">
<h2>Практика</h2>

<div class="box">
Это короткая практика для снижения тревоги и напряжения.<br><br>
Используйте в спокойной обстановке.
</div>

<audio controls style="width:100%;">
<source src="https://andreyastafiev-source.github.io/hypnosis-webapp/Hipno_2-001.mp3">
</audio>

<a class="btn" href="https://t.me/AndreyAstafiev">Записаться</a>
</div>

<!-- FAST TEST -->
<div id="fast" class="screen">
<h2>Быстрое решение</h2>
<div id="fastQ"></div>
</div>

<!-- SUPERVISION TEST -->
<div id="sup" class="screen">
<h2>Супервизия</h2>
<div id="supQ"></div>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const mode=params.get("mode");

let step=0;
let answers={};

const questions=[
{key:"problem",title:"Что беспокоит?",options:["Тревога","Страх","Выгорание","Отношения"]},
{key:"symptom",title:"Как проявляется?",options:["Мысли","Напряжение","Избегание","Усталость"]},
{key:"trigger",title:"Когда усиливается?",options:["Один","Перед событиями","В общении","Постоянно"]},
{key:"reaction",title:"Как реагируете?",options:["Контроль","Избегаю","Замыкаюсь","Анализирую"]}
];

function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function startTest(){step=0;answers={};nextQ();}

function nextQ(){
let q=questions[step];
qTitle.innerText=q.title;
answersDiv.innerHTML="";
q.options.forEach(o=>{
let d=document.createElement("div");
d.className="card";
d.innerText=o;
d.onclick=()=>{
answers[q.key]=o;
step++;
if(step<questions.length) nextQ();
else showResult();
};
answersDiv.appendChild(d);
});
show("question");
}

function showResult(){

let text=`
<b>Тип реакции:</b><br>
У вас формируется устойчивый паттерн <b>${answers.problem}</b>.<br><br>

<b>Как это работает:</b><br>
Реакция запускается автоматически при триггере (${answers.trigger}) и поддерживается через поведение (${answers.reaction}).<br><br>

<b>Причина:</b><br>
Такие состояния закрепляются как защитная стратегия психики.<br><br>

<b>Последствия:</b><br>
— усиление напряжения<br>
— повторение сценариев<br>
— снижение качества жизни<br><br>

<b>Что работает:</b><br>
Работа с подсознанием (гипнотерапия) позволяет изменить эту реакцию на уровне формирования.
`;

resultText.innerHTML=text;

let msg=encodeURIComponent(
`Добрый день!
Хочу проработать состояние.

Проблема: ${answers.problem}
Проявление: ${answers.symptom}
Триггер: ${answers.trigger}
Реакция: ${answers.reaction}`
);

consultBtn.href=`https://t.me/AndreyAstafiev?text=${msg}`;
hypnoBtn.href=`https://t.me/AndreyAstafiev?text=${msg}%0AИнтересует гипноз`;

show("result");
}

/* FAST */
let fastData={step:0,data:{}};

const fastSteps=[
{key:"problem",title:"С чем работать?",options:["Тревога","Страх","Отношения"]},
{key:"depth",title:"Насколько мешает?",options:["Сильно","Средне","Иногда"]},
{key:"time",title:"Как давно?",options:["Давно","Недавно","Периодически"]}
];

function fastNext(val){
let s=fastSteps[fastData.step];
fastData.data[s.key]=val;
fastData.step++;

if(fastData.step<fastSteps.length){
renderFast();
}else{
let msg=encodeURIComponent(
`Добрый день!
Хочу консультацию.

Проблема: ${fastData.data.problem}
Интенсивность: ${fastData.data.depth}
Длительность: ${fastData.data.time}`
);
fastQ.innerHTML=`<a class="btn" target="_blank" href="https://t.me/AndreyAstafiev?text=${msg}">Записаться</a>`;
}
}

function renderFast(){
let s=fastSteps[fastData.step];
fastQ.innerHTML=`<h3>${s.title}</h3>`;
s.options.forEach(o=>{
let d=document.createElement("div");
d.className="card";
d.innerText=o;
d.onclick=()=>fastNext(o);
fastQ.appendChild(d);
});
}

/* SUPERVISION */
let supData={step:0,data:{}};

const supSteps=[
{key:"type",title:"Тип кейса",options:["Сложный клиент","Нет прогресса","Не понимаю"]},
{key:"exp",title:"Ваш опыт",options:["<1 года","1-3","3+"]},
{key:"goal",title:"Что нужно?",options:["Разбор","Решение","Поддержка"]}
];

function supNext(val){
let s=supSteps[supData.step];
supData.data[s.key]=val;
supData.step++;

if(supData.step<supSteps.length){
renderSup();
}else{
let msg=encodeURIComponent(
`Добрый день!
Супервизия.

Кейс: ${supData.data.type}
Опыт: ${supData.data.exp}
Цель: ${supData.data.goal}`
);
supQ.innerHTML=`<a class="btn" target="_blank" href="https://t.me/AndreyAstafiev?text=${msg}">Отправить запрос</a>`;
}
}

function renderSup(){
let s=supSteps[supData.step];
supQ.innerHTML=`<h3>${s.title}</h3>`;
s.options.forEach(o=>{
let d=document.createElement("div");
d.className="card";
d.innerText=o;
d.onclick=()=>supNext(o);
supQ.appendChild(d);
});
}

/* ROUTING */
if(mode==="diagnostic") startTest();
else if(mode==="fast"){show("fast");renderFast();}
else if(mode==="supervision"){show("sup");renderSup();}
else if(mode==="audio") show("audio");
else startTest();
</script>

</body>
</html>
