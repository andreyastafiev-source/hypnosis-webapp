<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ВАЖНО -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{font-family:sans-serif;background:#f6f7fb;padding:20px;}
.card{display:none;background:#fff;padding:20px;border-radius:16px;}
button{width:100%;padding:14px;margin-top:10px;border-radius:12px;}
</style>
</head>

<body>

<div id="loading">Загрузка...</div>

<div id="diagnostic" class="card">
<h2 id="q"></h2>
<div id="a"></div>
</div>

<div id="result" class="card">
<h2>Результат</h2>
<p id="text"></p>
<button onclick="sendResult()">Отправить</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function show(id){
document.getElementById("loading").style.display="none";
document.querySelectorAll('.card').forEach(el=>el.style.display="none");
document.getElementById(id).style.display="block";
}

/* TEST */
let i=0,score=0;

const qs=[
"Как часто тревожные мысли?",
"Есть напряжение?",
"Сложно расслабиться?",
"Есть страхи?",
"Чувство потери контроля?"
];

function start(){
i=0;score=0;next();
}

function next(){
q.innerText=qs[i];
a.innerHTML=`
<button onclick="ans(2)">Часто</button>
<button onclick="ans(1)">Иногда</button>
<button onclick="ans(0)">Редко</button>`;
}

function ans(v){
score+=v;i++;
if(i<qs.length){next();}
else{finish();}
}

function finish(){
show("result");

text.innerText = "Баллы: "+score;
}

/* SEND */

function sendResult(){
tg.sendData(JSON.stringify({
type:"diagnostic",
score:score
}));
}

/* MODE + FALLBACK */

const params = new URLSearchParams(window.location.search);
let mode = params.get("mode");

if(!mode){
mode = "diagnostic"; // fallback
}

setTimeout(()=>{
if(mode==="diagnostic"){
show("diagnostic");
start();
}
},100);

</script>

</body>
</html>
