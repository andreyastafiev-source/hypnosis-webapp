<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
}

.progress {
    margin-bottom: 10px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="card">
    <div id="progress" class="progress"></div>
    <h2 id="question"></h2>
    <div id="answers"></div>
</div>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const questions = [
    "Чувствуете тревогу?",
    "Есть напряжение в теле?",
    "Трудно расслабиться?",
    "Много мыслей в голове?",
    "Есть страх или беспокойство?"
];

let step = 0;
let score = 0;

function render() {
    document.getElementById("progress").innerText =
        `Вопрос ${step + 1} из ${questions.length}`;

    document.getElementById("question").innerText =
        questions[step];

    document.getElementById("answers").innerHTML = `
        <button onclick="answer(2)">Да</button>
        <button onclick="answer(1)">Иногда</button>
        <button onclick="answer(0)">Нет</button>
    `;
}

function answer(val) {
    score += val;
    step++;

    if (step >= questions.length) {
        finish();
    } else {
        render();
    }
}

function finish() {
    let result = "";

    if (score >= 8) result = "🔴 Высокий уровень тревоги";
    else if (score >= 4) result = "🟡 Средний уровень";
    else result = "🟢 Низкий уровень";

    document.getElementById("question").innerHTML =
        `${result}<br><br>Баллы: ${score}`;

    document.getElementById("answers").innerHTML = `
        <button onclick="send()">Отправить результат</button>
    `;
}

function send() {
    tg.sendData(JSON.stringify({
        type: "diagnostic",
        score: score
    }));

    setTimeout(() => tg.close(), 300);
}

render();
</script>

</body>
</html>
