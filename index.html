<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Психологическая диагностика</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f7f8fb;
      color: #1f2937;
      padding: 20px;
    }

    .wrap {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    p {
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
      background: #1e3a8a;
      color: white;
      font-size: 16px;
    }

    .secondary {
      background: #e5e7eb;
      color: #111;
    }

    .hidden {
      display: none;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="home" class="card">
    <h1>Что вас беспокоит?</h1>
    <p>Выберите, что хотите сделать:</p>

    <button onclick="go('diagnostic')">🧠 Пройти диагностику</button>
    <button onclick="go('audio')">🎧 Снять напряжение</button>
    <button onclick="go('fast')">⚡ Решить проблему</button>
    <button onclick="go('supervision')">👨‍⚕️ Супервизия</button>
  </div>

  <!-- ТЕСТ -->
  <div id="diagnostic" class="card hidden">
    <h1>Диагностика состояния</h1>
    <p>Как часто вы чувствуете тревогу?</p>

    <button onclick="answer(2)">Постоянно</button>
    <button onclick="answer(1)">Иногда</button>
    <button onclick="answer(0)">Редко</button>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="result" class="card hidden">
    <h1>Ваш результат</h1>
    <p id="resultText"></p>

    <button onclick="sendToTelegram()">Записаться на консультацию</button>
  </div>

  <!-- АУДИО -->
  <div id="audio" class="card hidden">
    <h1>Снятие напряжения</h1>

    <p>
      Используйте это аудио, когда:
      <br>— тревога усиливается  
      <br>— сложно остановить мысли  
      <br>— есть напряжение в теле  
    </p>

    <audio controls>
      <source src="https://github.com/andreyastafiev-source/hypnosis-webapp/raw/main/Hipno_2-001.mp3" type="audio/mpeg">
    </audio>

    <button onclick="back()">Назад</button>
  </div>

  <!-- FAST -->
  <div id="fast" class="card hidden">
    <h1>Опишите проблему</h1>

    <textarea id="fastText" placeholder="Что вас беспокоит..." style="width:100%;height:100px;"></textarea>

    <button onclick="sendFast()">Отправить</button>
  </div>

  <!-- SUPERVISION -->
  <div id="supervision" class="card hidden">
    <h1>Супервизия</h1>

    <textarea id="supText" placeholder="Опишите кейс..." style="width:100%;height:100px;"></textarea>

    <button onclick="sendSupervision()">Отправить</button>
  </div>

</div>

<script>
let score = 0;

const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

function go(mode) {
  hideAll();
  document.getElementById(mode).classList.remove("hidden");
}

function hideAll() {
  document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
}

function back() {
  hideAll();
  document.getElementById('home').classList.remove('hidden');
}

function answer(val) {
  score = val;

  hideAll();
  document.getElementById('result').classList.remove('hidden');

  let text = "";

  if (score === 2) {
    text = "Высокий уровень тревоги. Вероятно, состояние уже закрепилось и требует проработки.";
  } else if (score === 1) {
    text = "Средний уровень тревоги. Состояние можно скорректировать.";
  } else {
    text = "Низкий уровень тревоги. Но важно не игнорировать сигналы.";
  }

  document.getElementById("resultText").innerText = text;
}

function sendToTelegram() {
  const text = "Добрый день, хочу проработать состояние";
  window.open("https://t.me/hypnosis_therapy_bot?text=" + encodeURIComponent(text));
}

function sendFast() {
  const text = document.getElementById("fastText").value;
  window.open("https://t.me/hypnosis_therapy_bot?text=" + encodeURIComponent("Хочу решить проблему: " + text));
}

function sendSupervision() {
  const text = document.getElementById("supText").value;
  window.open("https://t.me/hypnosis_therapy_bot?text=" + encodeURIComponent("Супервизия: " + text));
}

/* --- MODE AUTOLOAD --- */

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

if (mode) {
  go(mode);
}
</script>

</body>
</html>
