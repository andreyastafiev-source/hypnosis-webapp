<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Психологическая диагностика</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:16px;
}

.container {
  max-width:520px;
  margin:0 auto;
}

.screen { display:none; }
.active { display:block; }

.card {
  background:white;
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  border:1px solid #eee;
  cursor:pointer;
}

.card:hover { background:#eef2ff; }

.btn {
  display:block;
  margin-top:20px;
  text-align:center;
  background:#1e3a8a;
  color:white;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
}

.result-box {
  background:white;
  padding:16px;
  border-radius:12px;
  margin-top:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<!-- МЕНЮ -->
<div id="menu" class="screen active">
  <h2 id="hello">Что вы хотите сейчас?</h2>

  <div class="card" onclick="startTest()">Пройти диагностику</div>
  <div class="card" onclick="show('fast')">Решить проблему</div>
  <div class="card" onclick="show('supervision')">Супервизия</div>
</div>

<!-- ВОПРОС -->
<div id="question" class="screen">
  <h2 id="qTitle"></h2>
  <div id="answers"></div>
</div>

<!-- РЕЗУЛЬТАТ -->
<div id="result" class="screen">
  <h2>Ваш результат</h2>

  <div id="resultText" class="result-box"></div>

  <h3 style="margin-top:20px;">🎧 Попробуйте практику</h3>
  <audio controls style="width:100%;">
    <source src="https://github.com/andreyastafiev-source/hypnosis-webapp/blob/2b06a262b576e54cd7517d398890952ca9742321/Hipno_2-001.mp3">
  </audio>

  <a class="btn" href="https://t.me/AndreyAstafiev?text=Хочу%20проработать%20состояние">
    Начать работу
  </a>
</div>

<!-- FAST -->
<div id="fast" class="screen">
  <h2>Выберите проблему</h2>

  <div class="card">Тревога</div>
  <div class="card">Страх</div>
  <div class="card">Отношения</div>

  <a class="btn" href="https://t.me/AndreyAstafiev">Записаться</a>
</div>

<!-- SUPERVISION -->
<div id="supervision" class="screen">
  <h2>Супервизия</h2>

  <div class="card">Разбор кейса</div>
  <div class="card">Сложный клиент</div>

  <a class="btn" href="https://t.me/AndreyAstafiev">Отправить запрос</a>
</div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;
const name = user?.first_name || "Вы";

document.getElementById("hello").innerText =
  name + ", что вы хотите сейчас?";

let answersData = {};

const questions = [
  {
    key: "main",
    title: "Что вас беспокоит больше всего?",
    options: ["Тревога","Страх","Выгорание","Отношения"]
  },
  {
    key: "symptom",
    title: "Как это проявляется чаще всего?",
    options: [
      "Постоянные мысли",
      "Физическое напряжение",
      "Избегание ситуаций",
      "Эмоциональная усталость"
    ]
  },
  {
    key: "trigger",
    title: "Когда это усиливается?",
    options: [
      "Когда остаюсь один",
      "Перед важными событиями",
      "В общении",
      "Постоянно"
    ]
  },
  {
    key: "reaction",
    title: "Как вы обычно реагируете?",
    options: [
      "Контролирую",
      "Избегаю",
      "Замыкаюсь",
      "Переосмысливаю"
    ]
  }
];

let step = 0;

function show(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screen).classList.add('active');
}

function startTest() {
  step = 0;
  answersData = {};
  showQuestion();
}

function showQuestion() {
  const q = questions[step];
  document.getElementById("qTitle").innerText = q.title;

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  q.options.forEach(opt => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = opt;

    div.onclick = () => {
      answersData[q.key] = opt;
      step++;

      if (step < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    };

    answers.appendChild(div);
  });

  show("question");
}

function showResult() {
  let text = `
<b>${name}, по вашим ответам:</b><br><br>

У вас формируется реакция, связанная с <b>${answersData.main}</b>.<br><br>

Что это значит:<br>
Ваша психика находится в состоянии повышенного напряжения и пытается контролировать ситуацию.<br><br>

Почему это происходит:<br>
Формируется устойчивая реакция на триггеры (${answersData.trigger}), которая закрепилась на уровне подсознания.<br><br>

Как это влияет:<br>
• усиливает внутреннее напряжение<br>
• снижает качество жизни<br>
• формирует повторяющиеся сценарии<br><br>

⚠️ Если это не проработать, состояние будет усиливаться<br><br>

💡 В вашем случае эффективна работа с подсознанием (гипнотерапия)
`;

  document.getElementById("resultText").innerHTML = text;
  show("result");
}
</script>

</body>
</html>
