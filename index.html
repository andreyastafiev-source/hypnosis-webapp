<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {font-family:sans-serif;background:#f6f7fb;padding:20px;}
.card {display:none;background:#fff;padding:20px;border-radius:16px;}
button {width:100%;padding:14px;margin-top:10px;border-radius:12px;cursor:pointer;}
.progress {color:#666;margin-bottom:10px;}
</style>
</head>

<body>

<!-- ===== ДИАГНОСТИКА ===== -->
<div id="diagnostic" class="card">
<div class="progress" id="dProg"></div>
<h2 id="dQ"></h2>
<div id="dA"></div>
</div>

<div id="dResult" class="card">
<h2>Анализ состояния</h2>
<p id="dText"></p>

<button onclick="go('audio')">Снизить состояние</button>
<button onclick="sendDiag()">Записаться на консультацию</button>
</div>

<!-- ===== АУДИО ===== -->
<div id="audio" class="card">
<h2>Снижение тревоги и напряжения</h2>

<p>
Это аудиопрактика для работы с состоянием.

Когда использовать:
— тревога  
— перегрузка  
— перед сном  

Как:
— в наушниках  
— спокойно, без отвлечений  
</p>

<audio controls>
<source src="https://github.com/andreyastafiev-source/hypnosis-webapp/raw/main/Hipno_2-001.mp3">
</audio>

<button onclick="sendAudio()">Хочу консультацию</button>
</div>

<!-- ===== РАЗБОР ===== -->
<div id="fast" class="card">
<div class="progress" id="fProg"></div>
<h3 id="fQ"></h3>
<div id="fA"></div>
</div>

<!-- ===== СУПЕРВИЗИЯ ===== -->
<div id="sup" class="card">
<div class="progress" id="sProg"></div>
<h3 id="sQ"></h3>
<div id="sA"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg) tg.expand();

/* ===== НАВИГАЦИЯ ===== */
function go(id){
document.querySelectorAll('.card').forEach(el=>el.style.display="none");
document.getElementById(id).style.display="block";
}

/* ===== ДИАГНОСТИКА ===== */
let di=0, score=0;

const dq=[
"Как часто вы прокручиваете одни и те же мысли?",
"Есть ли напряжение в теле без причины?",
"Сложно ли остановить внутренний диалог?",
"Возникают ли тревожные сценарии?",
"Есть ли ощущение потери контроля?",
"Есть ли проблемы со сном?",
"Сложно ли расслабиться?"
];

function startD(){
di=0;score=0;nextD();
}

function nextD(){
dProg.innerText=`Вопрос ${di+1} из ${dq.length}`;
dQ.innerText=dq[di];

dA.innerHTML=`
<button onclick="ansD(3)">Почти всегда</button>
<button onclick="ansD(2)">Часто</button>
<button onclick="ansD(1)">Иногда</button>
<button onclick="ansD(0)">Редко</button>`;
}

function ansD(v){
score+=v;di++;
if(di<dq.length){nextD();}
else{finishD();}
}

function finishD(){
go("dResult");

let text="";

if(score>=15){
text=`Высокий уровень тревожного паттерна.

Состояние уже закрепилось и запускается автоматически.

Проявления:
— постоянные мысли  
— напряжение  
— потеря контроля  

Рекомендация:
работа с подсознательной реакцией + консультация`;
}
else if(score>=8){
text=`Средний уровень тревоги.

Паттерн формируется, но ещё гибкий.

Рекомендация:
можно быстро скорректировать состояние`;
}
else{
text=`Низкий уровень тревоги.

Есть отдельные триггеры, но без закрепления.`;
}

dText.innerText=text;
}

function sendDiag(){
tg.sendData(JSON.stringify({type:"diagnostic",score}));
setTimeout(()=>tg.close(),500);
}

/* ===== АУДИО ===== */
function sendAudio(){
tg.sendData(JSON.stringify({type:"audio"}));
setTimeout(()=>tg.close(),500);
}

/* ===== FAST ===== */
let fi=0,fd={};

const fq=[
{q:"Что беспокоит?",a:["Тревога","Страх","Отношения","Самооценка"]},
{q:"Как давно?",a:["Недавно","Месяцы","Годы"]},
{q:"Насколько мешает?",a:["Слабо","Средне","Сильно"]}
];

function startF(){fi=0;fd={};nextF();}

function nextF(){
fProg.innerText=`Шаг ${fi+1} из ${fq.length}`;
fQ.innerText=fq[fi].q;
fA.innerHTML=fq[fi].a.map(a=>`<button onclick="ansF('${a}')">${a}</button>`).join("");
}

function ansF(v){
fd[fq[fi].q]=v;fi++;
if(fi<fq.length){nextF();}
else{
tg.sendData(JSON.stringify({type:"fast",data:fd}));
setTimeout(()=>tg.close(),500);
}
}

/* ===== SUP ===== */
let si=0,sd={};

const sq=[
{q:"Метод?",a:["CBT","Гипноз","Психоанализ"]},
{q:"Тип кейса?",a:["Тревога","Травма","Поведение"]},
{q:"Где сложность?",a:["Нет динамики","Сопротивление","Не понимаю"]}
];

function startS(){si=0;sd={};nextS();}

function nextS(){
sProg.innerText=`Шаг ${si+1} из ${sq.length}`;
sQ.innerText=sq[si].q;
sA.innerHTML=sq[si].a.map(a=>`<button onclick="ansS('${a}')">${a}</button>`).join("");
}

function ansS(v){
sd[sq[si].q]=v;si++;
if(si<sq.length){nextS();}
else{
tg.sendData(JSON.stringify({type:"supervision",data:sd}));
setTimeout(()=>tg.close(),500);
}
}

/* ===== MODE ===== */
const m=new URLSearchParams(location.search).get("mode");

if(m==="diagnostic"){go("diagnostic");startD();}
if(m==="audio"){go("audio");}
if(m==="fast"){go("fast");startF();}
if(m==="supervision"){go("sup");startS();}
</script>

</body>
</html>
