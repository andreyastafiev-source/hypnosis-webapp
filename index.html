<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: sans-serif; background:#f6f7fb; padding:20px; }
.card { display:none; background:#fff; padding:20px; border-radius:16px; }
button { width:100%; padding:14px; margin-top:10px; }
</style>
</head>

<body>

<!-- DIAGNOSTIC -->
<div id="diagnostic" class="card">
<h2 id="qTitle"></h2>
<div id="answers"></div>
</div>

<!-- RESULT -->
<div id="result" class="card">
<h2>Результат</h2>
<p id="resultText"></p>
<button onclick="sendDiag()">Записаться</button>
</div>

<!-- AUDIO -->
<div id="audio" class="card">
<h2>Практика</h2>
<audio controls>
<source src="https://github.com/andreyastafiev-source/hypnosis-webapp/raw/main/Hipno_2-001.mp3">
</audio>
</div>

<!-- FAST -->
<div id="fast" class="card">
<h2>Опишите проблему</h2>
<textarea id="fastText"></textarea>
<button onclick="sendFast()">Отправить</button>
</div>

<!-- SUP -->
<div id="supervision" class="card">
<h2>Супервизия</h2>
<textarea id="supText"></textarea>
<button onclick="sendSup()">Отправить</button>
</div>

<script>

/* NAV */

function show(id){
document.querySelectorAll('.card').forEach(el=>el.style.display="none");
document.getElementById(id).style.display="block";
}

/* TEST */

let q=0, score=0;

const qs=[
"Как часто мысли крутятся?",
"Есть ли напряжение?",
"Сложно расслабиться?",
"Есть тревожные сценарии?",
"Есть ощущение потери контроля?"
];

function startTest(){
q=0; score=0; next();
}

function next(){
document.getElementById("qTitle").innerText=qs[q];
document.getElementById("answers").innerHTML=`
<button onclick="ans(2)">Часто</button>
<button onclick="ans(1)">Иногда</button>
<button onclick="ans(0)">Редко</button>
`;
}

function ans(v){
score+=v; q++;
if(q<qs.length){next();}
else{result();}
}

function result(){
show("result");

let t="";
if(score>=8){t="Сильная тревога — нужна проработка";}
else if(score>=4){t="Средний уровень";}
else{t="Низкий уровень";}

document.getElementById("resultText").innerText=t;
}

/* SEND */

function sendDiag(){
window.open("https://t.me/hypnosis_therapy_bot?text=Хочу консультацию");
}

function sendFast(){
window.open("https://t.me/hypnosis_therapy_bot?text="+fastText.value);
}

function sendSup(){
window.open("https://t.me/hypnosis_therapy_bot?text="+supText.value);
}

/* MODE */

const mode=new URLSearchParams(window.location.search).get("mode");

if(mode==="diagnostic"){
show("diagnostic");
startTest();
}

if(mode==="audio"){
show("audio");
}

if(mode==="fast"){
show("fast");
}

if(mode==="supervision"){
show("supervision");
}

</script>

</body>
</html>
