<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика состояния</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background:#f6f7fb;
  margin:0;
  padding:20px;
}
.wrap { max-width:520px; margin:auto; }
.card {
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:16px;
}
h1 { font-size:22px; margin-bottom:10px; }
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#1e3a8a;
  color:white;
  font-size:15px;
}
.hidden { display:none; }
textarea, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}
audio { width:100%; margin-top:15px; }
</style>
</head>

<body>
<div class="wrap">

<!-- HOME -->
<div id="home" class="card">
<h1>Что вас беспокоит?</h1>
<button onclick="go('diagnostic')">🧠 Пройти диагностику</button>
<button onclick="go('audio')">🎧 Снять напряжение</button>
<button onclick="go('fast')">⚡ Решить проблему</button>
<button onclick="go('supervision')">👨‍⚕️ Супервизия</button>
</div>

<!-- DIAGNOSTIC -->
<div id="diagnostic" class="card hidden">
<h1 id="qTitle"></h1>
<div id="answers"></div>
</div>

<!-- RESULT -->
<div id="result" class="card hidden">
<h1>Результат анализа</h1>
<p id="resultText"></p>
<button onclick="sendDiag()">Записаться на консультацию</button>
</div>

<!-- AUDIO -->
<div id="audio" class="card hidden">
<h1>Снятие напряжения</h1>
<p>Используйте при тревоге, перегрузке, перед сном.</p>
<audio controls>
<source src="https://github.com/andreyastafiev-source/hypnosis-webapp/raw/main/Hipno_2-001.mp3">
</audio>
<button onclick="back()">Назад</button>
</div>

<!-- FAST -->
<div id="fast" class="card hidden">
<h1>Опишите ситуацию</h1>

<select id="problem">
<option>Тревога</option>
<option>Страх</option>
<option>Отношения</option>
<option>Самооценка</option>
</select>

<select id="duration">
<option>Недавно</option>
<option>Несколько месяцев</option>
<option>Годы</option>
</select>

<textarea id="tried" placeholder="Что уже пробовали?"></textarea>

<button onclick="sendFast()">Отправить</button>
</div>

<!-- SUPERVISION -->
<div id="supervision" class="card hidden">
<h1>Супервизия</h1>

<select id="method">
<option>CBT</option>
<option>Гипноз</option>
<option>Психоанализ</option>
</select>

<textarea id="case" placeholder="Описание кейса"></textarea>
<textarea id="block" placeholder="Где затык?"></textarea>

<button onclick="sendSup()">Отправить</button>
</div>

</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();

/* -------- NAV -------- */

function go(id){
hide();
document.getElementById(id).classList.remove("hidden");

if(id==="diagnostic") startTest();
}

function hide(){
document.querySelectorAll('.card').forEach(el=>el.classList.add('hidden'));
}

function back(){
hide();
home.classList.remove("hidden");
}

/* -------- TEST -------- */

let qIndex=0;
let score=0;

const questions=[
"Как часто вы прокручиваете мысли?",
"Есть ли напряжение в теле без причины?",
"Сложно ли остановить внутренний диалог?",
"Есть ли сценарии 'а вдруг'?",
"Чувствуете потерю контроля?"
];

function startTest(){
qIndex=0;
score=0;
showQ();
}

function showQ(){
document.getElementById("qTitle").innerText=questions[qIndex];

document.getElementById("answers").innerHTML=`
<button onclick="ans(2)">Часто</button>
<button onclick="ans(1)">Иногда</button>
<button onclick="ans(0)">Редко</button>
`;
}

function ans(v){
score+=v;
qIndex++;

if(qIndex<questions.length){
showQ();
}else{
showResult();
}
}

function showResult(){
hide();
result.classList.remove("hidden");

let text="";

if(score>=8){
text=`Высокий уровень тревоги.

У вас сформирована устойчивая реакция психики.  
Состояние запускается автоматически и не контролируется логикой.

Рекомендуется глубокая проработка.`;
}
else if(score>=4){
text=`Средний уровень тревоги.

Паттерн формируется, но ещё гибкий.  
Можно быстро скорректировать состояние.`;
}
else{
text=`Низкий уровень тревоги.

Есть отдельные триггеры, но они не закреплены.`;
}

document.getElementById("resultText").innerText=text;
}

/* -------- SEND -------- */

function sendDiag(){
const text=`Добрый день, хочу проработать состояние.
Результат теста: ${score}`;
window.open("https://t.me/hypnosis_therapy_bot?text="+encodeURIComponent(text));
}

function sendFast(){
const text=`
Хочу решить проблему:

Проблема: ${problem.value}
Длительность: ${duration.value}
Пробовал: ${tried.value}
`;
window.open("https://t.me/hypnosis_therapy_bot?text="+encodeURIComponent(text));
}

function sendSup(){
const text=`
Супервизия:

Метод: ${method.value}
Кейс: ${case.value}
Проблема: ${block.value}
`;
window.open("https://t.me/hypnosis_therapy_bot?text="+encodeURIComponent(text));
}

/* -------- MODE -------- */

const params=new URLSearchParams(window.location.search);
const mode=params.get("mode");
if(mode){go(mode);}
</script>

</body>
</html>
