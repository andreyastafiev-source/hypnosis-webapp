<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#f6f7fb;padding:20px;}
.card{display:none;background:#fff;padding:20px;border-radius:16px;}
button{width:100%;padding:14px;margin-top:10px;border-radius:12px;}
.progress{color:#666;margin-bottom:10px;}
</style>
</head>

<body>

<div id="diagnostic" class="card">
<div class="progress" id="prog"></div>
<h2 id="q"></h2>
<div id="a"></div>
</div>

<div id="result" class="card">
<h2>Анализ состояния</h2>
<p id="text"></p>

<button onclick="go('audio')">Снизить состояние</button>
<button onclick="sendResult()">Записаться</button>
</div>

<div id="audio" class="card">
<h2>Снижение тревоги</h2>
<p>Используйте при тревоге, перед сном, при перегрузе.</p>
<audio controls>
<source src="https://github.com/andreyastafiev-source/hypnosis-webapp/raw/main/Hipno_2-001.mp3">
</audio>
<button onclick="sendAudio()">Записаться</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

function show(id){
document.querySelectorAll('.card').forEach(el=>el.style.display="none");
document.getElementById(id).style.display="block";
}

/* TEST */
let i=0,score=0;

const qs=[
"Как часто вы прокручиваете мысли?",
"Есть напряжение в теле?",
"Сложно остановить мысли?",
"Есть тревожные сценарии?",
"Чувство потери контроля?"
];

function start(){
i=0;score=0;next();
}

function next(){
prog.innerText=`${i+1}/${qs.length}`;
q.innerText=qs[i];
a.innerHTML=`
<button onclick="ans(2)">Часто</button>
<button onclick="ans(1)">Иногда</button>
<button onclick="ans(0)">Редко</button>`;
}

function ans(v){
score+=v;i++;
if(i<qs.length){next();}
else{finish();}
}

function finish(){
show("result");

let t="";
if(score>=8){
t="Высокий уровень тревоги. Нужна глубокая работа.";
}
else if(score>=4){
t="Средний уровень. Можно скорректировать.";
}
else{
t="Низкий уровень.";
}

text.innerText=t;
}

/* SEND */

function sendResult(){
tg.sendData(JSON.stringify({
type:"diagnostic",
score:score
}));
}

function sendAudio(){
tg.sendData(JSON.stringify({
type:"audio"
}));
}

/* START */

const mode=new URLSearchParams(location.search).get("mode");

if(mode==="diagnostic"){show("diagnostic");start();}
if(mode==="audio"){show("audio");}
</script>

</body>
</html>
