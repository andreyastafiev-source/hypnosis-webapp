<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {font-family:sans-serif;background:#f6f7fb;padding:20px;}
.card {display:none;background:#fff;padding:20px;border-radius:16px;}
button {width:100%;padding:14px;margin-top:10px;border-radius:12px;}
.progress {color:#666;margin-bottom:10px;}
</style>
</head>

<body>

<!-- ===== ДИАГНОСТИКА ===== -->
<div id="diagnostic" class="card">
<div class="progress" id="prog"></div>
<h2 id="question"></h2>
<div id="answers"></div>
</div>

<div id="result" class="card">
<h2>Анализ состояния</h2>
<p id="resultText"></p>

<button onclick="go('audio')">Снизить состояние</button>
<button onclick="sendResult()">Записаться на консультацию</button>
</div>

<!-- ===== АУДИО ===== -->
<div id="audio" class="card">
<h2>Снижение тревоги</h2>

<p>
Используйте:
— при тревоге  
— перед сном  
— при перегрузке  
</p>

<audio controls>
<source src="https://github.com/andreyastafiev-source/hypnosis-webapp/raw/main/Hipno_2-001.mp3">
</audio>

<button onclick="sendAudio()">Хочу консультацию</button>
</div>

<!-- ===== FAST ===== -->
<div id="fast" class="card">
<div class="progress" id="fProg"></div>
<h3 id="fQ"></h3>
<div id="fA"></div>
</div>

<!-- ===== SUP ===== -->
<div id="sup" class="card">
<div class="progress" id="sProg"></div>
<h3 id="sQ"></h3>
<div id="sA"></div>
</div>

<script>

const tg = window.Telegram?.WebApp;

/* ===== НАВИГАЦИЯ ===== */
function go(id){
document.querySelectorAll('.card').forEach(el=>el.style.display="none");
document.getElementById(id).style.display="block";
}

/* ===== ОТПРАВКА БЕЗ СЕРВЕРА ===== */
function sendToChat(text){
if(tg){
tg.sendData(text);
setTimeout(()=>tg.close(),300);
} else {
alert(text);
}
}

/* ===== ДИАГНОСТИКА ===== */
let step=0, score=0;

const q=[
"Как часто вы прокручиваете мысли?",
"Есть ли напряжение?",
"Сложно расслабиться?",
"Есть тревожные сценарии?",
"Чувство потери контроля?"
];

function start(){
step=0;score=0;next();
}

function next(){
prog.innerText=`Вопрос ${step+1} из ${q.length}`;
question.innerText=q[step];

answers.innerHTML=`
<button onclick="ans(3)">Почти всегда</button>
<button onclick="ans(2)">Часто</button>
<button onclick="ans(1)">Иногда</button>
<button onclick="ans(0)">Редко</button>`;
}

function ans(v){
score+=v;step++;
if(step<q.length){next();}
else{finish();}
}

function finish(){
go("result");

let text="";
if(score>=10){
text="Высокий уровень тревоги. Рекомендуется работа со специалистом.";
}
else if(score>=5){
text="Средний уровень тревоги. Можно скорректировать.";
}
else{
text="Низкий уровень тревоги.";
}

resultText.innerText=text;
}

/* ===== ОТПРАВКА ===== */
function sendResult(){
sendToChat(`🧠 Заявка\nБаллы: ${score}`);
}

function sendAudio(){
sendToChat("🎧 Хочу консультацию после практики");
}

/* ===== FAST ===== */
let fi=0,fd={};

const fq=[
{q:"Что беспокоит?",a:["Тревога","Страх","Отношения"]},
{q:"Как давно?",a:["Недавно","Давно"]},
{q:"Насколько мешает?",a:["Слабо","Сильно"]}
];

function startF(){fi=0;fd={};nextF();}

function nextF(){
fProg.innerText=`Шаг ${fi+1} из ${fq.length}`;
fQ.innerText=fq[fi].q;
fA.innerHTML=fq[fi].a.map(a=>`<button onclick="ansF('${a}')">${a}</button>`).join("");
}

function ansF(v){
fd[fq[fi].q]=v;fi++;
if(fi<fq.length){nextF();}
else{
sendToChat(`⚡ Разбор\n${JSON.stringify(fd)}`);
}
}

/* ===== SUP ===== */
let si=0,sd={};

const sq=[
{q:"Метод?",a:["CBT","Гипноз"]},
{q:"Тип кейса?",a:["Тревога","Травма"]},
{q:"Где сложность?",a:["Нет динамики","Не понимаю"]}
];

function startS(){si=0;sd={};nextS();}

function nextS(){
sProg.innerText=`Шаг ${si+1} из ${sq.length}`;
sQ.innerText=sq[si].q;
sA.innerHTML=sq[si].a.map(a=>`<button onclick="ansS('${a}')">${a}</button>`).join("");
}

function ansS(v){
sd[sq[si].q]=v;si++;
if(si<sq.length){nextS();}
else{
sendToChat(`👨‍⚕️ Супервизия\n${JSON.stringify(sd)}`);
}
}

/* ===== MODE ===== */
const m=new URLSearchParams(location.search).get("mode");

if(m==="diagnostic"){go("diagnostic");start();}
if(m==="audio"){go("audio");}
if(m==="fast"){go("fast");startF();}
if(m==="supervision"){go("sup");startS();}

</script>

</body>
</html>
