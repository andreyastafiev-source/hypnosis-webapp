<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Диагностика состояния</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px 14px;
      color: #1f2937;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }

    .hero {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    p {
      font-size: 15px;
      line-height: 1.5;
      color: #6b7280;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: #f9fafb;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid #eef1f5;
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      background: #f3f6ff;
    }

    .card h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .card p {
      font-size: 13px;
    }

    .selected {
      border: 1.5px solid #1e3a8a;
      background: #eef2ff;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eef2ff;
      font-size: 14px;
      display: none;
      line-height: 1.5;
    }

    .btn {
      margin-top: 18px;
      display: block;
      text-align: center;
      background: #1e3a8a;
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }

    .btn:hover {
      background: #162d6b;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">

      <h1>Что вас беспокоит сейчас?</h1>
      <p>Выберите состояние — получите краткий разбор и рекомендацию.</p>

      <div class="grid">
        <div class="card" onclick="selectCard(this, 'anxiety')">
          <h3>Тревога</h3>
          <p>Напряжение, контроль мыслей, страх будущего</p>
        </div>

        <div class="card" onclick="selectCard(this, 'fear')">
          <h3>Страх</h3>
          <p>Фобии, страх общения, выступлений</p>
        </div>

        <div class="card" onclick="selectCard(this, 'burnout')">
          <h3>Выгорание</h3>
          <p>Нет энергии, усталость, пустота</p>
        </div>

        <div class="card" onclick="selectCard(this, 'relations')">
          <h3>Отношения</h3>
          <p>Конфликты, страх близости</p>
        </div>
      </div>

      <div id="result" class="result"></div>

      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfFQ0KzzKgeAuc6lPDxHrrwaMYGjMhxugpIfSk5rV_Pw5wDGQ/viewform?usp=sharing" target="_blank">
        Записаться на консультацию
      </a>

    </div>
  </div>

  <script>
    function selectCard(el, type) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');

      const result = document.getElementById('result');
      result.style.display = 'block';

      let text = '';

      if (type === 'anxiety') {
        text = 'У вас выраженная тревожность. Часто это связано с внутренним напряжением и гиперконтролем. Гипнотерапия помогает быстро снизить уровень тревоги.';
      }

      if (type === 'fear') {
        text = 'Страхи закрепляются на уровне подсознания. Через гипноз можно изменить реакцию и убрать триггер.';
      }

      if (type === 'burnout') {
        text = 'Признаки эмоционального выгорания. Важно восстановить ресурс и снизить внутреннее давление.';
      }

      if (type === 'relations') {
        text = 'Повторяющиеся сценарии в отношениях. Часто это глубинные установки, которые эффективно прорабатываются.';
      }

      result.innerHTML = text;
    }
  </script>

</body>
</html>
